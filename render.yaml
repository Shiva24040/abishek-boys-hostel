services:
  - type: web
    name: abhishek-boys-hostel
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma db push && node prisma/seed.js && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: NEXT_PUBLIC_APP_NAME
        value: Abhishek Boys Hostel
      - key: NEXT_PUBLIC_DEFAULT_FEE
        value: "5000"
      - key: AUTH_SECRET
        value: abhishek-hostel-secure-jwt-secret-key-2026-production
      - key: ADMIN_NAME
        value: Mahesh
      - key: ADMIN_EMAIL
        value: admin@abhishekhostel.com
      - key: ADMIN_PHONE
        value: "+91 9059860870"
      - key: ADMIN_PASSWORD
        value: AdminPassword@2026
